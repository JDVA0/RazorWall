name: release

# Publica binarios para Linux, Windows y macOS cuando se empuja una
# etiqueta (por ejemplo v1.0.0). Los tests se ejecutan antes de compilar,
# y despues cada binario se prueba generando un PNG de verdad.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  BIN: razorwall

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La version importa por dos motivos: docs/razorwall.wasm se compila
      # con ella, y docs/wasm_exec.js tiene que ser de la misma. Los binarios
      # solo son reproducibles si el toolchain es el mismo, asi que se fija
      # aqui y hay que regenerarlos cuando se cambie.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::ficheros sin gofmt:"
            echo "$out"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # La web se comprueba igual que el binario: el wasm debe producir
      # exactamente los mismos bytes que la CLI, y el script de la pagina
      # debe cablear bien los controles.
      #
      # wasm_exec.js no se copia aqui a proposito: va versionado y tiene que
      # ser exactamente el de la toolchain que compilo el .wasm. Regenerar
      # solo el .wasm y no el .js dejaria la pagina sin arrancar.
      - name: compilar wasm
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o docs/razorwall.wasm .

      - name: el wasm no debe desviarse de la CLI
        run: node test/wasm_test.cjs

      - name: comprobar el wasm versionado
        run: |
          if ! git diff --quiet -- docs/razorwall.wasm; then
            echo "::error::docs/razorwall.wasm no coincide con el fuente."
            echo "Regeneralo con el mismo Go del CI (1.26) y versiona el resultado."
            exit 1
          fi

      - name: comprobar que wasm_exec.js es el del toolchain
        run: |
          for p in lib/wasm misc/wasm; do
            if [ -f "$(go env GOROOT)/$p/wasm_exec.js" ]; then
              src="$(go env GOROOT)/$p/wasm_exec.js"
              break
            fi
          done
          [ -n "${src:-}" ] || { echo "::error::no encuentro wasm_exec.js en el GOROOT"; exit 1; }
          if ! cmp -s "$src" docs/wasm_exec.js; then
            echo "::error::docs/wasm_exec.js no es el de este Go ($src)."
            echo "Copia ese archivo a docs/ y versiona el cambio."
            exit 1
          fi

      - name: el script de la pagina
        run: node test/page_test.cjs

  build:
    name: ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            archive: tar.gz
          - os: ubuntu-latest
            arch: arm64
            archive: tar.gz
          - os: macos-latest
            arch: amd64
            archive: tar.gz
          - os: macos-latest
            arch: arm64
            archive: tar.gz
          - os: windows-latest
            arch: amd64
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: compilar
        shell: bash
        run: |
          mkdir -p dist
          out="dist/${BIN}-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            out="${out}.exe"
          fi
          # -trimpath quita rutas locales del binario;
          # -s -w eliminan la tabla de simbolos y el DWARF
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -trimpath -ldflags="-s -w" -o "$out" .

      - name: smoke test
        shell: bash
        run: |
          bin=$(ls dist/${BIN}-* | head -1)
          [ "${{ matrix.os }}" = "windows-latest" ] && bin="dist/${BIN}-windows-amd64.exe"
          # genera un fondo de verdad para confirmar que el binario corre
          "$bin" --seed 1 --size 320x180 --out dist/smoke.png
          test -s dist/smoke.png
          "$bin" --version

      - name: comprimir
        shell: bash
        run: |
          base="dist/${BIN}-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            base="${base}.exe"
            (cd dist && zip -q -9 "${base%.exe}.zip" "$(basename "$base")")
          else
            tar -C dist -czf "${base}.tar.gz" "$(basename "$base")"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: publicar release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/checksums.txt
          generate_release_notes: true
